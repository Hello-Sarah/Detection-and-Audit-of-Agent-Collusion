<text x="156" y="274" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#202428">2,000 fictional customers</text>
<text x="156" y="302" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#202428">20,000 transactions</text>
