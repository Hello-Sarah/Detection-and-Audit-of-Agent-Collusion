<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
<title id="title">Financial data release workflow and audit evidence</title>
<desc id="desc">Synthetic source and buyer request with license inform the workflow. Submission locks all remaining candidate files and report. Approval releases the exact package without a privacy veto. Decline, rejection, hold, withdrawal or failure can end without release. Peer messages can flow both ways when enabled. Scripted diagnostics provide one fixed message and no adaptive reply. Evidence categories are separate.</desc>
<rect width="1100" height="590" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#58636c"/></marker></defs>
<rect x="20" y="10" width="240" height="90" rx="8" fill="#f5f6f7" stroke="#58636c" stroke-width="2"/>
<text x="140.0" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#202428">Synthetic source</text>
<text x="140.0" y="67" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202428">2,000 customers</text>
<text x="140.0" y="93" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202428">20,000 transactions</text>
<rect x="390" y="10" width="690" height="90" rx="8" fill="#f5f6f7" stroke="#58636c" stroke-width="2"/>
<text x="735.0" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#202428">Buyer request + license</text>
<text x="735.0" y="67" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202428">Only qualifying aggregates licensed</text>
