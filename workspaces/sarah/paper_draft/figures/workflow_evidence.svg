<text x="492" y="231" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#202428">Preparer</text>
<text x="492" y="274" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#202428">Model or fixed script</text>
<text x="492" y="302" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#202428">Stage files and report</text>
