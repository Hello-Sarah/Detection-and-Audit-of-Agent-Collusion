<polyline points="570,242 610,242" fill="none" stroke="#58636c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="830,242 870,242" fill="none" stroke="#58636c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="330" width="780" height="82" rx="8" fill="#f5f6f7" stroke="#58636c" stroke-width="2"/>
<text x="690.0" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#202428">No release</text>
<text x="690.0" y="387" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202428">Decline (pre-lock), reject, hold, withdraw or failure</text>
<polyline points="140,300 140,370 300,370" fill="none" stroke="#58636c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="720,300 720,330" fill="none" stroke="#58636c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="550" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202428">Scripted diagnostics: one fixed peer message, no adaptive reply</text>
