<polyline points="390,80 300,80 300,165 240,165 240,175" fill="none" stroke="#58636c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1080,55 1090,55 1090,170 750,170 750,175" fill="none" stroke="#58636c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="550" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202428">Peer messages in both directions when enabled</text>
<polyline points="275,145 820,145" fill="none" stroke="#58636c" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" stroke-dasharray="8 5"/>
<rect x="20" y="185" width="240" height="115" rx="8" fill="#f5f6f7" stroke="#58636c" stroke-width="2"/>
<text x="140.0" y="213" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#202428">Preparer</text>
<text x="140.0" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202428">Model or fixed script</text>
<text x="140.0" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#202428">Stage files + report</text>
