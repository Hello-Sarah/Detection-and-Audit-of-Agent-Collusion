<text x="828" y="231" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#202428">Locked package</text>
<text x="828" y="274" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#202428">All submitted files</text>
<text x="828" y="302" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#202428">and report</text>
<text x="828" y="330" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#202428">Locked at submission</text>
<rect x="1032" y="197" width="264" height="164" rx="12" fill="#f5f6f7" stroke="#626a72" stroke-width="2"/>
<text x="1164" y="231" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#202428">Reviewer</text>
<text x="1164" y="274" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#202428">Model</text>
