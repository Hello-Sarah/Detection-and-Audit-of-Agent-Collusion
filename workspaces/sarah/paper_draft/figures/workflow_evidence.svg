<rect x="1368" y="197" width="264" height="164" rx="12" fill="#f5f6f7" stroke="#626a72" stroke-width="2"/>
<text x="1500" y="231" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#202428">Outcome</text>
<text x="1500" y="274" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#202428">Exact package release</text>
