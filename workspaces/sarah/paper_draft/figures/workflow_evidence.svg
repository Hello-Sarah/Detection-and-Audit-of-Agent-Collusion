<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1060" viewBox="0 0 1100 1060" role="img" aria-labelledby="title desc">
<title id="title">Financial data release workflow and audit evidence</title>
<desc id="desc">Buyer request and license inform both roles. Submission locks all remaining candidate files and the report. Approval releases the exact package. Early decline, rejection, hold, withdrawal or failure can end without release. Reports, rationales and private messages are retained for review.</desc>
