<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="640" viewBox="0 0 1664 640" role="img" aria-labelledby="title desc">
<title id="title">Financial data release workflow and audit evidence</title>
<desc id="desc">Synthetic source, preparer, locked package, reviewer and exact release or non release, with logged peer messages and separate evidence categories. Preparer origin varies between model and fixed script.</desc>
<rect width="1664" height="640" fill="white"/>
<text x="832" y="45" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#202428">Financial data release workflow and audit evidence</text>
<text x="832" y="85" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#535b63">Experimental workflow with exact simulated release</text>
<text x="828" y="120" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#535b63">Peer messages when enabled, researcher logged</text>
